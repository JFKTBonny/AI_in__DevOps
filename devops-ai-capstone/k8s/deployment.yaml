apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-ai-capstone
  labels:
    app: devops-ai-capstone
spec:
  replicas: 1
  selector:
    matchLabels:
      app: devops-ai-capstone
  template:
    metadata:
      labels:
        app: devops-ai-capstone
    spec:
      containers:
        - name: triage-api
          image: devops-ai-capstone:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: GROQ_API_KEY
              valueFrom:
                secretKeyRef:
                  name: groq-api
                  key: api-key
            - name: GROQ_MODEL
              value: llama-3.3-70b-versatile
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 10001
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: devops-ai-capstone
spec:
  type: ClusterIP
  selector:
    app: devops-ai-capstone
  ports:
    - name: http
      port: 8080
      targetPort: http
